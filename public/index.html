<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge AI Harness</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #252525;
      --text-primary: #e4e4e4;
      --text-secondary: #a0a0a0;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --border: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .new-session-btn {
      margin: 16px 20px;
      padding: 10px 16px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .new-session-btn:hover { background: var(--accent-hover); }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .session-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .session-item:hover { background: var(--bg-tertiary); }
    .session-item.active { background: var(--bg-tertiary); border-left: 3px solid var(--accent); }

    .session-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-date {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-secondary);
    }

    .provider-info {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      gap: 16px;
    }

    .provider-badge {
      padding: 4px 10px;
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 14px 18px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
    }

    .message.tool {
      align-self: flex-start;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      font-family: monospace;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .message.error {
      align-self: flex-start;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .tool-call-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 8px;
      padding: 4px 8px;
      background: var(--bg-primary);
      border-radius: 4px;
    }

    .input-area {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 14px;
      resize: none;
      min-height: 52px;
      max-height: 150px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--accent); }

    .send-btn {
      padding: 14px 24px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .send-btn:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--text-secondary);
    }

    .welcome h2 {
      font-size: 24px;
      color: var(--text-primary);
    }

    .welcome p {
      font-size: 14px;
      max-width: 400px;
      text-align: center;
      line-height: 1.6;
    }

    .empty-state {
      display: none;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">F</div>
        Forge AI
      </div>
    </div>
    <button class="new-session-btn" onclick="createNewSession()">+ New Session</button>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="provider-info" id="providerInfo">
        <span class="provider-badge" id="providerBadge">Loading...</span>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome">
        <h2>Welcome to Forge</h2>
        <p>Select or create a session to start chatting with the AI agent. The agent can use plugins and tools to help you.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="messageInput"
          placeholder="Type your message..."
          rows="1"
          onkeydown="handleKeyDown(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <span>Send</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    let currentSessionId = null;
    let isProcessing = false;
    const API_BASE = window.location.origin;

    // Auto-resize textarea
    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
    }

    // Handle Enter key
    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // Create new session
    async function createNewSession() {
      try {
        const res = await fetch(`${API_BASE}/api/session/new`, { method: 'POST' });
        const data = await res.json();
        currentSessionId = data.id;
        loadSessions();
        clearMessages();
        showWelcome();
      } catch (err) {
        console.error('Failed to create session:', err);
      }
    }

    // Load sessions list
    async function loadSessions() {
      try {
        const res = await fetch(`${API_BASE}/api/sessions`);
        const sessions = await res.json();
        const listEl = document.getElementById('sessionList');
        listEl.innerHTML = '';

        sessions.forEach(session => {
          const item = document.createElement('div');
          item.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');
          item.innerHTML = `
            <div class="session-title">${session.title || 'Untitled'}</div>
            <div class="session-date">${formatDate(session.created_at)}</div>
          `;
          item.onclick = () => loadSession(session.id);
          listEl.appendChild(item);
        });
      } catch (err) {
        console.error('Failed to load sessions:', err);
      }
    }

    // Load session messages
    async function loadSession(sessionId) {
      currentSessionId = sessionId;
      loadSessions();
      clearMessages();

      try {
        const res = await fetch(`${API_BASE}/api/sessions/${sessionId}/messages`);
        const messages = await res.json();
        messages.forEach(msg => appendMessage(msg.role, msg.content, msg.metadata));
      } catch (err) {
        console.error('Failed to load messages:', err);
      }
    }

    // Send message
    async function sendMessage() {
      if (isProcessing || !currentSessionId) return;

      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;

      isProcessing = true;
      input.value = '';
      input.style.height = 'auto';
      setLoading(true);

      appendMessage('user', message);

      try {
        const res = await fetch(`${API_BASE}/api/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: currentSessionId, message }),
        });

        const data = await res.json();

        if (data.error) {
          appendMessage('error', `Error: ${data.error}`);
        } else {
          if (data.content) {
            appendMessage('assistant', data.content);
          }
          if (data.toolCalls) {
            appendToolCalls(data.toolCalls);
          }
          if (data.usage) {
            appendUsage(data.usage);
          }
        }
      } catch (err) {
        appendMessage('error', `Network error: ${err.message}`);
      } finally {
        isProcessing = false;
        setLoading(false);
      }
    }

    // Append message to chat
    function appendMessage(role, content, metadata = {}) {
      const welcome = document.querySelector('.welcome');
      if (welcome) welcome.remove();

      const messagesEl = document.getElementById('messages');
      const msgEl = document.createElement('div');
      msgEl.className = `message ${role}`;

      if (metadata.name) {
        msgEl.innerHTML = `<strong>${metadata.name}:</strong> ${escapeHtml(content)}`;
      } else {
        msgEl.textContent = content;
      }

      messagesEl.appendChild(msgEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Append tool call indicator
    function appendToolCalls(toolCalls) {
      const messagesEl = document.getElementById('messages');
      const toolEl = document.createElement('div');
      toolEl.className = 'tool';
      toolEl.innerHTML = `<div class="tool-call-indicator">🔧 Using tools: ${toolCalls.map(tc => tc.name).join(', ')}</div>`;
      messagesEl.appendChild(toolEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // Append token usage
    function appendUsage(usage) {
      const messagesEl = document.getElementById('messages');
      const usageEl = document.createElement('div');
      usageEl.className = 'tool';
      usageEl.innerHTML = `<div class="tool-call-indicator">⚡ Tokens: ${usage.promptTokens}+${usage.completionTokens}=${usage.totalTokens}</div>`;
      messagesEl.appendChild(usageEl);
    }

    // Clear messages
    function clearMessages() {
      document.getElementById('messages').innerHTML = '';
    }

    // Show welcome state
    function showWelcome() {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = `
        <div class="welcome">
          <h2>Welcome to Forge</h2>
          <p>Select or create a session to start chatting with the AI agent.</p>
        </div>
      `;
    }

    // Set loading state
    function setLoading(loading) {
      const btn = document.getElementById('sendBtn');
      btn.disabled = loading;
      if (loading) {
        btn.innerHTML = '<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      } else {
        btn.innerHTML = '<span>Send</span>';
      }
    }

    // Format date
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    async function init() {
      // Load provider info
      try {
        const res = await fetch(`${API_BASE}/api/status`);
        if (res.ok) {
          const status = await res.json();
          document.getElementById('providerBadge').textContent = `${status.provider} | ${status.model}`;
        }
      } catch {}

      // Load sessions
      await loadSessions();

      // Focus input
      document.getElementById('messageInput').focus();
    }

    init();
  </script>
</body>
</html>
